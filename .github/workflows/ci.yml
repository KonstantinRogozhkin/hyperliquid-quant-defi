name: CI

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**/*.py"
      - "config/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      UV_NO_PROGRESS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 0 || 1 }}
          persist-credentials: false

      - name: Check Python/config changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "run_py=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED="$(git diff --name-only "$BASE_SHA" HEAD)"
          echo "Changed files:"
          printf '%s\n' "$CHANGED"
          if printf '%s\n' "$CHANGED" | grep -Eq '^(src/|tests/|scripts/.*\.py$|config/|pyproject\.toml$|uv\.lock$|\.github/workflows/ci\.yml$)'; then
            echo "run_py=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_py=false" >> "$GITHUB_OUTPUT"
            echo "Docs/ops-only PR: skipping Python setup and tests."
          fi

      - uses: astral-sh/setup-uv@v5
        if: steps.changes.outputs.run_py == 'true'
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dev dependencies
        if: steps.changes.outputs.run_py == 'true'
        run: uv sync --locked --no-install-project --extra dev

      - name: Run checks and unit tests
        if: steps.changes.outputs.run_py == 'true'
        run: |
          .venv/bin/ruff check src scripts tests
          .venv/bin/pytest -q --tb=short -p no:cacheprovider
