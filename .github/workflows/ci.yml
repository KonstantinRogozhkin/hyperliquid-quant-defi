name: CI

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "config/**"
      - "frontend/**"
      - "docker/**"
      - "docker-compose.yml"
      - "docker-compose.dokploy.yml"
      - "docs/grafana/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ci.yml"
      - ".github/workflows/release.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      UV_NO_PROGRESS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Check Python/config changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "run_py=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            CHANGED="$(git diff --name-only "$BASE_SHA" HEAD)"
          else
            CHANGED="$(git diff --name-only HEAD^1 HEAD)"
          fi
          echo "Changed files:"
          printf '%s\n' "$CHANGED"
          if printf '%s\n' "$CHANGED" | grep -Eq '^(src/|tests/|scripts/|config/|docs/grafana/|pyproject\.toml$|uv\.lock$|docker/|docker-compose\.yml$|docker-compose\.dokploy\.yml$|\.github/workflows/(ci|release)\.yml$)'; then
            echo "run_py=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_py=false" >> "$GITHUB_OUTPUT"
            echo "No Python/config changes: skipping Python setup and tests."
          fi

      - uses: astral-sh/setup-uv@v7
        if: steps.changes.outputs.run_py == 'true'
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dev dependencies
        if: steps.changes.outputs.run_py == 'true'
        run: |
          command -v zsh >/dev/null 2>&1 || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends zsh)
          uv sync --locked --no-install-project --extra dev

      - name: Run checks and unit tests
        if: steps.changes.outputs.run_py == 'true'
        run: |
          .venv/bin/ruff check src scripts tests
          .venv/bin/pytest -q --tb=short -p no:cacheprovider

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Check frontend changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "run_fe=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            CHANGED="$(git diff --name-only "$BASE_SHA" HEAD)"
          else
            CHANGED="$(git diff --name-only HEAD^1 HEAD)"
          fi
          if printf '%s\n' "$CHANGED" | grep -Eq '^(frontend/|docker/frontend\.Dockerfile$|docker/nginx\.conf$|docker-compose\.yml$|docker-compose\.dokploy\.yml$|\.github/workflows/(ci|release)\.yml$)'; then
            echo "run_fe=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_fe=false" >> "$GITHUB_OUTPUT"
            echo "No frontend changes: skipping Node build."
          fi

      - uses: actions/setup-node@v7
        if: steps.changes.outputs.run_fe == 'true'
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install, test, and build frontend
        if: steps.changes.outputs.run_fe == 'true'
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build
