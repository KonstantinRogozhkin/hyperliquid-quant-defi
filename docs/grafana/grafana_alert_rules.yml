# Grafana Unified Alerting provisioning file (drop into /etc/grafana/provisioning/alerting/)
# Replace datasourceUid with your Prometheus UID if different from `prometheus`.
apiVersion: 1

groups:
  - orgId: 1
    name: hl-quant-critical
    folder: Hyperliquid Quant DeFi
    interval: 1m
    rules:
      - uid: hl-crit-worker-down
        title: "CRITICAL: HL Worker Down / Scrape Missing"
        condition: C
        for: 3m
        noDataState: Alerting
        execErrState: Alerting
        labels:
          severity: critical
          service: hyperliquid-quant-defi
        annotations:
          summary: "Hyperliquid Quant Worker heartbeat stale (>300s) or /api/v1/metrics scrape missing"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model: { expr: "hl_worker_up", instant: true, refId: A }
          - refId: C
            datasourceUid: __expr__
            model: { type: threshold, expression: A, conditions: [{ evaluator: { type: lt, params: [1] } }], refId: C }

      - uid: hl-crit-job-failed
        title: "CRITICAL: HL Scheduler Job Failed"
        condition: C
        for: 2m
        noDataState: OK
        execErrState: Alerting
        labels:
          severity: critical
          service: hyperliquid-quant-defi
        annotations:
          summary: "One or more Hyperliquid UTC worker jobs failed"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model: { expr: "sum(hl_worker_job_failed)", instant: true, refId: A }
          - refId: C
            datasourceUid: __expr__
            model: { type: threshold, expression: A, conditions: [{ evaluator: { type: gt, params: [0] } }], refId: C }

      - uid: hl-crit-testnet-killswitch
        title: "CRITICAL: Testnet ALO Kill-Switch Triggered"
        condition: C
        for: 1m
        noDataState: OK
        execErrState: Alerting
        labels:
          severity: critical
          service: hyperliquid-quant-defi
        annotations:
          summary: "Live Testnet ALO executor tripped kill-switch (hl_testnet_last_cycle_ok == 0)"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model: { expr: "hl_testnet_last_cycle_ok", instant: true, refId: A }
          - refId: C
            datasourceUid: __expr__
            model: { type: threshold, expression: A, conditions: [{ evaluator: { type: lt, params: [1] } }], refId: C }

      - uid: hl-crit-liq-risk
        title: "CRITICAL: Testnet Liquidation Warning"
        condition: C
        for: 1m
        noDataState: OK
        execErrState: Alerting
        labels:
          severity: critical
          service: hyperliquid-quant-defi
        annotations:
          summary: "Active liquidation warning or min liquidation distance < 20%"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model: { expr: "(max(hl_testnet_liq_warnings) or vector(0)) + (max(hl_testnet_min_liq_distance_pct < bool 20) or vector(0))", instant: true, refId: A }
          - refId: C
            datasourceUid: __expr__
            model: { type: threshold, expression: A, conditions: [{ evaluator: { type: gt, params: [0] } }], refId: C }

      - uid: hl-crit-adl-risk
        title: "CRITICAL: Testnet High ADL Rank Warning"
        condition: C
        for: 2m
        noDataState: OK
        execErrState: Alerting
        labels:
          severity: critical
          service: hyperliquid-quant-defi
        annotations:
          summary: "One or more open Testnet positions triggered high Auto-Deleveraging (ADL) risk thresholds"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model: { expr: "max(hl_testnet_adl_warnings)", instant: true, refId: A }
          - refId: C
            datasourceUid: __expr__
            model: { type: threshold, expression: A, conditions: [{ evaluator: { type: gt, params: [0] } }], refId: C }

      - uid: hl-crit-nav-guard
        title: "CRITICAL: Bounded NAV Sanity Guard Active"
        condition: C
        for: 1m
        noDataState: OK
        execErrState: Alerting
        labels:
          severity: critical
          service: hyperliquid-quant-defi
        annotations:
          summary: "Bounded NAV Sanity Guard currently active on a desk strategy ledger"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model: { expr: "hl_desk_nav_guard_active", instant: true, refId: A }
          - refId: C
            datasourceUid: __expr__
            model: { type: threshold, expression: A, conditions: [{ evaluator: { type: gt, params: [0] } }], refId: C }

      - uid: hl-crit-hip3-oracle-div
        title: "CRITICAL: HIP-3 Oracle Divergence > 30 bps"
        condition: C
        for: 2m
        noDataState: OK
        execErrState: Alerting
        labels:
          severity: critical
          service: hyperliquid-quant-defi
        annotations:
          summary: "Open HIP-3 cross-builder pair oracle divergence exceeded 30 bps"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model: { expr: "max(hl_hip3_paper_pair_oracle_div_bps)", instant: true, refId: A }
          - refId: C
            datasourceUid: __expr__
            model: { type: threshold, expression: A, conditions: [{ evaluator: { type: gt, params: [30] } }], refId: C }

      - uid: hl-crit-spot-perp-risk
        title: "CRITICAL: Spot+Perp Delta Drift (>2%) or Margin (<15%)"
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Alerting
        labels:
          severity: critical
          service: hyperliquid-quant-defi
        annotations:
          summary: "HyperCore Spot+Perp net delta drifted beyond +-2% or perp liquidation buffer < 15%"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model: { expr: "(max(abs(hl_spot_perp_net_delta_pct) > bool 2.0) or on() vector(0)) + (max(hl_spot_perp_min_perp_liq_distance_pct < bool 15) or on() vector(0))", instant: true, refId: A }
          - refId: C
            datasourceUid: __expr__
            model: { type: threshold, expression: A, conditions: [{ evaluator: { type: gt, params: [0] } }], refId: C }

      - uid: hl-crit-autopilot-breach
        title: "CRITICAL: Autopilot CTA Cap (>6%) or Drift (>6%) Breach"
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Alerting
        labels:
          severity: critical
          service: hyperliquid-quant-defi
        annotations:
          summary: "Neutral Autopilot breached directional CTA cap or deadband weight drift limit"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model: { expr: "(max(hl_autopilot_directional_sleeve_pct > bool 6.0) or on() vector(0)) + (max(hl_autopilot_max_drift_pct > bool 6.0) or on() vector(0))", instant: true, refId: A }
          - refId: C
            datasourceUid: __expr__
            model: { type: threshold, expression: A, conditions: [{ evaluator: { type: gt, params: [0] } }], refId: C }

      - uid: hl-crit-dd-or-quota
        title: "CRITICAL: Strategy Current DD > 5% or API Quota > 0.85 req/$"
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Alerting
        labels:
          severity: critical
          service: hyperliquid-quant-defi
        annotations:
          summary: "Non-benchmark strategy is currently > 5% below its share-price peak or API rate limit > 0.85 req/$1"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model: { expr: "(max(hl_strategy_current_dd_pct{category!=\"Benchmark\"}) > bool 5.0 or on() vector(0)) + (max(hl_testnet_api_reqs_per_usd_vol > bool 0.85) or on() vector(0))", instant: true, refId: A }
          - refId: C
            datasourceUid: __expr__
            model: { type: threshold, expression: A, conditions: [{ evaluator: { type: gt, params: [0] } }], refId: C }

      - uid: hl-crit-testnet-drawdown
        title: "CRITICAL: Testnet Drawdown > 3.5% from HWM"
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Alerting
        labels:
          severity: critical
          service: hyperliquid-quant-defi
        annotations:
          summary: "Live Testnet equity is more than 3.5% below the executor HWM (kill-switch at 5%)"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model: { expr: "max(hl_testnet_drawdown_pct)", instant: true, refId: A }
          - refId: C
            datasourceUid: __expr__
            model: { type: threshold, expression: A, conditions: [{ evaluator: { type: gt, params: [3.5] } }], refId: C }

  - orgId: 1
    name: hl-quant-warning
    folder: Hyperliquid Quant DeFi
    interval: 1m
    rules:
      - uid: hl-warn-artifact-stale
        title: "WARNING: Telemetry Artifact Stale (> 6h) or Missing"
        condition: C
        for: 15m
        noDataState: OK
        execErrState: Alerting
        labels:
          severity: warning
          service: hyperliquid-quant-defi
        annotations:
          summary: "Core 4h/15m telemetry artifact missing or has not refreshed for > 360 minutes"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model: { expr: "(max(hl_artifact_age_minutes{artifact!~\"mm_calibration|settlement_study|onchain_events|testnet_.*\"} > bool 360) or vector(0)) + (max(hl_artifact_exists{artifact!~\"mm_calibration|settlement_study|onchain_events|testnet_.*\"} == bool 0) or vector(0))", instant: true, refId: A }
          - refId: C
            datasourceUid: __expr__
            model: { type: threshold, expression: A, conditions: [{ evaluator: { type: gt, params: [0] } }], refId: C }

      - uid: hl-warn-settlement-degraded
        title: "WARNING: Settlement Study Collection Degraded (< 80%)"
        condition: C
        for: 15m
        noDataState: OK
        execErrState: Alerting
        labels:
          severity: warning
          service: hyperliquid-quant-defi
        annotations:
          summary: "Latest :00 funding settlement study collected < 80% of requested coins"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model: { expr: "max(hl_settlement_study_degraded)", instant: true, refId: A }
          - refId: C
            datasourceUid: __expr__
            model: { type: threshold, expression: A, conditions: [{ evaluator: { type: gt, params: [0] } }], refId: C }

      - uid: hl-warn-alo-fill-low
        title: "WARNING: Testnet ALO Fill Rate Low (< 65%)"
        condition: C
        for: 30m
        noDataState: OK
        execErrState: Alerting
        labels:
          severity: warning
          service: hyperliquid-quant-defi
        annotations:
          summary: "Real ALO post-only fill rate dropped below 65% (target >= 85%)"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model: { expr: "min(hl_testnet_alo_fill_rate_pct)", instant: true, refId: A }
          - refId: C
            datasourceUid: __expr__
            model: { type: threshold, expression: A, conditions: [{ evaluator: { type: lt, params: [65] } }], refId: C }

      - uid: hl-warn-testnet-drawdown
        title: "WARNING: Testnet Drawdown > 2% from HWM"
        condition: C
        for: 15m
        noDataState: OK
        execErrState: Alerting
        labels:
          severity: warning
          service: hyperliquid-quant-defi
        annotations:
          summary: "Live Testnet equity is more than 2% below the executor HWM"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model: { expr: "max(hl_testnet_drawdown_pct)", instant: true, refId: A }
          - refId: C
            datasourceUid: __expr__
            model: { type: threshold, expression: A, conditions: [{ evaluator: { type: gt, params: [2.0] } }], refId: C }

      - uid: hl-warn-testnet-orphans
        title: "WARNING: Testnet Orphan Positions (no two-sided book)"
        condition: C
        for: 30m
        noDataState: OK
        execErrState: Alerting
        labels:
          severity: warning
          service: hyperliquid-quant-defi
        annotations:
          summary: "Unmanaged non-dust Testnet orphan positions outside active target weights with no resting unwind order"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model: { expr: "max(hl_testnet_unmanaged_orphan_positions)", instant: true, refId: A }
          - refId: C
            datasourceUid: __expr__
            model: { type: threshold, expression: A, conditions: [{ evaluator: { type: gt, params: [0] } }], refId: C }

      - uid: hl-warn-testnet-mark-oracle
        title: "WARNING: Testnet Mark-vs-Oracle uPnL Gap > 1% of Equity"
        condition: C
        for: 30m
        noDataState: OK
        execErrState: Alerting
        labels:
          severity: warning
          service: hyperliquid-quant-defi
        annotations:
          summary: "Thin Testnet books pushed mark prices away from oracle; mark-based PnL misstates exposure"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model: { expr: "max(hl_testnet_mark_oracle_pnl_gap_pct)", instant: true, refId: A }
          - refId: C
            datasourceUid: __expr__
            model: { type: threshold, expression: A, conditions: [{ evaluator: { type: gt, params: [1.0] } }], refId: C }

      - uid: hl-warn-coin-mark-oracle
        title: "WARNING: Testnet Per-Coin Mark-vs-Oracle Deviation > 15%"
        condition: C
        for: 30m
        noDataState: OK
        execErrState: Alerting
        labels:
          severity: warning
          service: hyperliquid-quant-defi
        annotations:
          summary: "At least one open Testnet perp position has |mark/oracle - 1| > 15% for 30m"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model: { expr: "max(abs(hl_testnet_mark_oracle_max_dev_pct))", instant: true, refId: A }
          - refId: C
            datasourceUid: __expr__
            model: { type: threshold, expression: A, conditions: [{ evaluator: { type: gt, params: [15.0] } }], refId: C }

      - uid: hl-warn-testnet-risk-stale
        title: "WARNING: Testnet Risk Probe Stale (> 45 min)"
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Alerting
        labels:
          severity: warning
          service: hyperliquid-quant-defi
        annotations:
          summary: "hl_testnet_risk/latest.json missing or not refreshed for > 45 min while the probe job is enabled; live drawdown/orphan telemetry is blind"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model: { expr: "(max((hl_artifact_age_minutes{artifact=\"testnet_risk\"} > bool 45) * ignoring(artifact, worker_job) (hl_worker_job_enabled{worker_job=\"testnet_risk_probe\"} == bool 1)) or vector(0)) + (max((hl_artifact_exists{artifact=\"testnet_risk\"} == bool 0) * ignoring(artifact, worker_job) (hl_worker_job_enabled{worker_job=\"testnet_risk_probe\"} == bool 1)) or vector(0))", instant: true, refId: A }
          - refId: C
            datasourceUid: __expr__
            model: { type: threshold, expression: A, conditions: [{ evaluator: { type: gt, params: [0] } }], refId: C }

      - uid: hl-warn-testnet-attr-stale
        title: "WARNING: Testnet Attribution Stale (> 5h)"
        condition: C
        for: 15m
        noDataState: OK
        execErrState: Alerting
        labels:
          severity: warning
          service: hyperliquid-quant-defi
        annotations:
          summary: "Testnet attribution artifact missing or older than 5h while the job is enabled; hl_testnet_* gauges are frozen"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model: { expr: "(max((hl_artifact_age_minutes{artifact=\"testnet_attribution\"} > bool 300) * ignoring(artifact, worker_job) (hl_worker_job_enabled{worker_job=\"testnet_attribution\"} == bool 1)) or vector(0)) + (max((hl_artifact_exists{artifact=\"testnet_attribution\"} == bool 0) * ignoring(artifact, worker_job) (hl_worker_job_enabled{worker_job=\"testnet_attribution\"} == bool 1)) or vector(0))", instant: true, refId: A }
          - refId: C
            datasourceUid: __expr__
            model: { type: threshold, expression: A, conditions: [{ evaluator: { type: gt, params: [0] } }], refId: C }

      - uid: hl-warn-testnet-executor-stale
        title: "WARNING: Testnet Executor Audit Log Stale (> 5h)"
        condition: C
        for: 15m
        noDataState: OK
        execErrState: Alerting
        labels:
          severity: warning
          service: hyperliquid-quant-defi
        annotations:
          summary: "hl_testnet_audit.jsonl missing or not appended for > 300 min while the testnet_executor job is enabled; the executor has silently stopped"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model: { expr: "(max((hl_artifact_age_minutes{artifact=\"testnet_audit\"} > bool 300) * ignoring(artifact, worker_job) (hl_worker_job_enabled{worker_job=\"testnet_executor\"} == bool 1)) or vector(0)) + (max((hl_artifact_exists{artifact=\"testnet_audit\"} == bool 0) * ignoring(artifact, worker_job) (hl_worker_job_enabled{worker_job=\"testnet_executor\"} == bool 1)) or vector(0))", instant: true, refId: A }
          - refId: C
            datasourceUid: __expr__
            model: { type: threshold, expression: A, conditions: [{ evaluator: { type: gt, params: [0] } }], refId: C }

      - uid: hl-warn-onchain-events-stale
        title: "WARNING: On-Chain Event Watcher Stale (> 45 min)"
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Alerting
        labels:
          severity: warning
          service: hyperliquid-quant-defi
        annotations:
          summary: "hl_onchain_events/latest_snapshot.json missing or not refreshed for > 45 min (cadence 15m); on-chain alerts are blind"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model: { expr: "(max(hl_artifact_age_minutes{artifact=\"onchain_events\"} > bool 45) or vector(0)) + (max(hl_artifact_exists{artifact=\"onchain_events\"} == bool 0) or vector(0))", instant: true, refId: A }
          - refId: C
            datasourceUid: __expr__
            model: { type: threshold, expression: A, conditions: [{ evaluator: { type: gt, params: [0] } }], refId: C }
