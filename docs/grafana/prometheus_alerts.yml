# Prometheus alerting rules for Hyperliquid Quant DeFi
# Drop into /etc/prometheus/alerts.yml (or /etc/prometheus/rules.d/hl_quant_defi.yml)
# and reload Prometheus (`kill -HUP <pid>` or `POST /-/reload`).

groups:
  - name: hyperliquid-quant-defi-critical
    interval: 60s
    rules:
      - alert: HLWorkerDown
        expr: hl_worker_up == 0 or absent(hl_worker_up)
        for: 3m
        labels:
          severity: critical
          service: hyperliquid-quant-defi
        annotations:
          summary: "Hyperliquid Quant Worker is DOWN or metrics scrape is absent"
          description: "hl_worker_up has been 0 or missing for >3m. Check hl-worker container and https://hl-quant.example.com/api/v1/metrics."

      - alert: HLWorkerJobFailed
        expr: hl_worker_job_failed == 1
        for: 2m
        labels:
          severity: critical
          service: hyperliquid-quant-defi
        annotations:
          summary: "Hyperliquid scheduler job failed: {{ $labels.worker_job }}"
          description: "UTC worker job {{ $labels.worker_job }} is in failed state. Check Dokploy hl-worker logs and /api/v1/scheduler/status."

      - alert: HLTestnetKillSwitchTriggered
        expr: hl_testnet_last_cycle_ok == 0
        for: 1m
        labels:
          severity: critical
          service: hyperliquid-quant-defi
        annotations:
          summary: "Testnet ALO Executor tripped kill-switch or failed last cycle"
          description: "hl_testnet_last_cycle_ok == 0. Inspect /api/v1/attribution and recent Testnet audit violations immediately."

      - alert: HLTestnetLiquidationRisk
        expr: hl_testnet_liq_warnings > 0 or hl_testnet_min_liq_distance_pct < 20
        for: 1m
        labels:
          severity: critical
          service: hyperliquid-quant-defi
        annotations:
          summary: "CRITICAL: Testnet liquidation proximity warning"
          description: "Liquidation warnings={{ $value }} or min liquidation distance dropped below 20% on live Testnet positions."

      - alert: HLTestnetADLRisk
        expr: hl_testnet_adl_warnings > 0
        for: 2m
        labels:
          severity: critical
          service: hyperliquid-quant-defi
        annotations:
          summary: "CRITICAL: Testnet high ADL rank warning"
          description: "One or more open Testnet positions triggered high Auto-Deleveraging (ADL) risk thresholds."

      - alert: HLBoundedNavGuardTriggered
        expr: hl_desk_nav_guard_active > 0
        for: 1m
        labels:
          severity: critical
          service: hyperliquid-quant-defi
        annotations:
          summary: "CRITICAL: Bounded NAV Sanity Guard circuit breaker active"
          description: "Anomalous single-tick NAV jump currently active on a desk strategy ledger (corrupt quote/oracle). Entries & rebalances paused until confirming tick."

      - alert: HLHIP3OracleDivergenceCritical
        expr: hl_hip3_paper_pair_oracle_div_bps > 30
        for: 2m
        labels:
          severity: critical
          service: hyperliquid-quant-defi
        annotations:
          summary: "CRITICAL: HIP-3 builder oracle divergence > 30 bps on {{ $labels.symbol }}"
          description: "Open HIP-3 pair {{ $labels.symbol }} ({{ $labels.short_dex }}/{{ $labels.long_dex }}) oracle divergence is {{ $value }} bps (approaching 35 bps emergency exit)."

      - alert: HLSpotPerpDeltaOrMarginCritical
        expr: abs(hl_spot_perp_net_delta_pct) > 2.0 or hl_spot_perp_min_perp_liq_distance_pct < 15
        for: 5m
        labels:
          severity: critical
          service: hyperliquid-quant-defi
        annotations:
          summary: "CRITICAL: HyperCore Spot+Perp delta drift or short-perp margin risk"
          description: "Spot+Perp net delta exceeded +-2.0% or short-perp liquidation buffer dropped below 15%."

      - alert: HLAutopilotRiskLimitBreach
        expr: hl_autopilot_directional_sleeve_pct > 6.0 or hl_autopilot_max_drift_pct > 6.0
        for: 5m
        labels:
          severity: critical
          service: hyperliquid-quant-defi
        annotations:
          summary: "CRITICAL: Neutral Autopilot risk cap or drift limit breached"
          description: "Crisis-CTA directional sleeve exceeded 6% (hard cap 5%) or sleeve weight drift exceeded 6% (deadband 3%)."

      - alert: HLStrategyDrawdownOrApiQuotaCritical
        expr: hl_strategy_current_dd_pct{category!="Benchmark"} > 5.0 or hl_testnet_api_reqs_per_usd_vol > 0.85
        for: 5m
        labels:
          severity: critical
          service: hyperliquid-quant-defi
        annotations:
          summary: "CRITICAL: Strategy current drawdown > 5% or HyperCore API Quota > 0.85 req/$"
          description: "A desk strategy is currently more than 5% below its share-price peak (hl_strategy_current_dd_pct; historical max DD is hl_strategy_max_dd_pct and does not alert) or API request rate is approaching HyperCore's 1 req/$1 volume ceiling."

      - alert: HLTestnetDrawdownNearKillSwitch
        expr: hl_testnet_drawdown_pct > 3.5
        for: 5m
        labels:
          severity: critical
          service: hyperliquid-quant-defi
        annotations:
          summary: "CRITICAL: Testnet equity {{ $value | humanize }}% below HWM (kill-switch at 5%)"
          description: "15m risk probe shows live Testnet drawdown > 3.5%. Check hl_testnet_unrealized_pnl_oracle_usd vs mark and orphan positions in /api/v1/overview testnet_risk."

  - name: hyperliquid-quant-defi-warning
    interval: 60s
    rules:
      - alert: HLArtifactStale
        expr: >-
          hl_artifact_age_minutes{artifact!~"mm_calibration|settlement_study|onchain_events|testnet_.*"} > 360
          or hl_artifact_exists{artifact!~"mm_calibration|settlement_study|onchain_events|testnet_.*"} == 0
        for: 15m
        labels:
          severity: warning
          service: hyperliquid-quant-defi
        annotations:
          summary: "Telemetry artifact stale (> 6h) or missing: {{ $labels.artifact }}"
          description: "Artifact {{ $labels.artifact }} is missing or has not refreshed for > 360 minutes."

      - alert: HLSettlementStudyDegraded
        expr: hl_settlement_study_degraded == 1
        for: 15m
        labels:
          severity: warning
          service: hyperliquid-quant-defi
        annotations:
          summary: "Settlement study collection degraded (< 80% coins collected)"
          description: "Latest :00 funding settlement study collected <80% of requested coins (likely HTTP 429); retained previous stats.parquet."

      - alert: HLTestnetALOFillRateLow
        expr: hl_testnet_alo_fill_rate_pct < 65
        for: 30m
        labels:
          severity: warning
          service: hyperliquid-quant-defi
        annotations:
          summary: "Testnet ALO post-only fill rate degraded (< 65%)"
          description: "Real ALO fill rate dropped to {{ $value }}% (target >= 85%). Check BBO spread conditions."

      - alert: HLTestnetDrawdownWarning
        expr: hl_testnet_drawdown_pct > 2.0
        for: 15m
        labels:
          severity: warning
          service: hyperliquid-quant-defi
        annotations:
          summary: "Testnet equity {{ $value | humanize }}% below HWM (warning > 2%)"
          description: "Live Testnet drawdown from the executor HWM exceeded 2% for 15m; kill-switch fires at 5% on the next 4h executor cycle."

      - alert: HLTestnetOrphanPositions
        expr: hl_testnet_unmanaged_orphan_positions > 0
        for: 30m
        labels:
          severity: warning
          service: hyperliquid-quant-defi
        annotations:
          summary: "{{ $value }} unmanaged Testnet orphan position(s) have no two-sided book"
          description: "Non-dust orphan Testnet position(s) outside active target weights have no resting unwind order. See hl_testnet_live_position_orphan and hl_testnet_live_orphan_notional_usd."

      - alert: HLTestnetMarkOracleDislocation
        expr: hl_testnet_mark_oracle_pnl_gap_pct > 1.0
        for: 30m
        labels:
          severity: warning
          service: hyperliquid-quant-defi
        annotations:
          summary: "Testnet mark-vs-oracle uPnL gap is {{ $value | humanize }}% of equity"
          description: "Thin Testnet books moved mark prices away from oracle; mark-based PnL and drawdown overstate (or understate) economic exposure."

      - alert: HLTestnetCoinMarkOracleDislocation
        expr: abs(hl_testnet_mark_oracle_max_dev_pct) > 15
        for: 30m
        labels:
          severity: warning
          service: hyperliquid-quant-defi
        annotations:
          summary: "Testnet per-coin mark-vs-oracle deviation is {{ $value | humanize }}% (> 15%)"
          description: "At least one open Testnet perp position has |mark/oracle - 1| > 15% for 30m (illiquid Testnet book dislocation)."

      - alert: HLTestnetRiskProbeStale
        expr: >-
          (hl_artifact_age_minutes{artifact="testnet_risk"} > 45 and ignoring(artifact, worker_job) hl_worker_job_enabled{worker_job="testnet_risk_probe"} == 1)
          or (hl_artifact_exists{artifact="testnet_risk"} == 0 and ignoring(artifact, worker_job) hl_worker_job_enabled{worker_job="testnet_risk_probe"} == 1)
        for: 5m
        labels:
          severity: warning
          service: hyperliquid-quant-defi
        annotations:
          summary: "Testnet 15m risk probe stale (> 45 min) or snapshot missing"
          description: "hl_testnet_risk/latest.json has not refreshed in > 45 min while enabled; live drawdown/orphan telemetry is blind. Check the testnet_risk_probe worker job."

      - alert: HLTestnetAttributionStale
        expr: >-
          (hl_artifact_age_minutes{artifact="testnet_attribution"} > 300 and ignoring(artifact, worker_job) hl_worker_job_enabled{worker_job="testnet_attribution"} == 1)
          or (hl_artifact_exists{artifact="testnet_attribution"} == 0 and ignoring(artifact, worker_job) hl_worker_job_enabled{worker_job="testnet_attribution"} == 1)
        for: 15m
        labels:
          severity: warning
          service: hyperliquid-quant-defi
        annotations:
          summary: "Testnet attribution stale (> 5h, cadence 4h) or artifact missing"
          description: "hl_testnet_* attribution gauges (equity, PnL, per-coin) are frozen at the last successful 4h run while enabled. Check the testnet_attribution worker job."

      - alert: HLTestnetExecutorStale
        expr: >-
          (hl_artifact_age_minutes{artifact="testnet_audit"} > 300 and ignoring(artifact, worker_job) hl_worker_job_enabled{worker_job="testnet_executor"} == 1)
          or (hl_artifact_exists{artifact="testnet_audit"} == 0 and ignoring(artifact, worker_job) hl_worker_job_enabled{worker_job="testnet_executor"} == 1)
        for: 15m
        labels:
          severity: warning
          service: hyperliquid-quant-defi
        annotations:
          summary: "Testnet executor audit log stale (> 5h, cadence 4h) or missing"
          description: "hl_testnet_audit.jsonl has not been appended for > 300 min while the testnet_executor job is enabled; the executor has silently stopped rebalancing. Check the testnet_executor worker job."

      - alert: HLOnchainEventsStale
        expr: >-
          hl_artifact_age_minutes{artifact="onchain_events"} > 45
          or hl_artifact_exists{artifact="onchain_events"} == 0
        for: 10m
        labels:
          severity: warning
          service: hyperliquid-quant-defi
        annotations:
          summary: "On-chain event watcher stale (> 45 min, cadence 15m) or snapshot missing"
          description: "hl_onchain_events/latest_snapshot.json has not refreshed for > 45 minutes; H2/H5/H6 on-chain alerts are blind. Check the onchain_events job."
